<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Caveat:wght@600;700&family=Inter:wght@500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; background:#e8e2d6; }

  /* paper: flat warm grey with a faint fibre texture, no gradients-as-decoration */
  .stage { position:relative; width:1200px; height:630px; overflow:hidden;
    background:
      repeating-linear-gradient(83deg, rgba(0,0,0,.018) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-11deg, rgba(255,255,255,.25) 0 1px, transparent 1px 9px),
      #e8e2d6; }

  /* left column: editorial type */
  .copy { position:absolute; left:64px; top:70px; width:470px; color:#1d1a16; }
  .kicker { font:600 13px/1 'Inter',sans-serif; letter-spacing:.18em; text-transform:uppercase; color:#8a2b1c; }
  .kicker span { color:#6b645a; }
  h1 { font-family:'Fraunces',serif; font-weight:400; font-size:66px; line-height:1.0; letter-spacing:-.02em;
       margin-top:26px; font-variation-settings:"opsz" 144; }
  h1 em { font-style:italic; color:#8a2b1c; }
  .sub { font-family:'Fraunces',serif; font-size:21px; line-height:1.35; color:#3d3830; margin-top:26px; width:420px; }
  .rule { width:56px; height:3px; background:#1d1a16; margin-top:30px; }
  .foot { position:absolute; left:64px; bottom:46px; font:500 14px/1 'Inter',sans-serif; color:#6b645a; letter-spacing:.02em; }
  .foot b { color:#1d1a16; font-weight:600; }

  /* the proof prints */
  .print { position:absolute; background:#fbfaf6; padding:11px 11px 34px; box-shadow:0 1px 1px rgba(0,0,0,.12), 0 12px 26px -10px rgba(40,30,15,.45); }
  .print img { display:block; }
  .print .cap { position:absolute; left:12px; bottom:10px; font:500 11px/1 'Inter',sans-serif; color:#7b7468; letter-spacing:.06em; text-transform:uppercase; }
  .tape { position:absolute; width:92px; height:26px; background:rgba(236,226,196,.82); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .p-orisa { left:600px; top:58px; transform:rotate(-5deg); }
  .p-orisa img { width:330px; height:290px; object-fit:cover; object-position:center top; }
  .p-norio { left:850px; top:150px; transform:rotate(4deg); z-index:2; }
  .p-norio img { width:290px; height:275px; object-fit:cover; object-position:left top; }
  .p-isak  { left:690px; top:338px; transform:rotate(-1.5deg); z-index:3; }
  .p-isak img { width:300px; height:205px; object-fit:cover; object-position:left top; }

  /* crop marks around the isak print */
  .crop { position:absolute; width:18px; height:18px; border-color:#1d1a16; border-style:solid; opacity:.55; z-index:4; }

  /* red grease pencil */
  svg.pencil { position:absolute; left:0; top:0; z-index:5; overflow:visible; }
  .note { position:absolute; font-family:'Caveat',cursive; font-weight:700; color:#b3261e; z-index:6; line-height:1; }
</style></head>
<body><div class="stage">

  <div class="copy">
    <div class="kicker">Laravel &nbsp;·&nbsp; <span>agency &amp; portfolio sites, 2026</span></div>
    <h1>Let the work<br>be the <em>loud</em><br>part.</h1>
    <p class="sub">Six ways to build a studio or portfolio site, what each one costs, and what you own at the end.</p>
    <div class="rule"></div>
  </div>
  <div class="foot"><b>botble.com</b>&nbsp;&nbsp;/&nbsp;&nbsp;blog</div>

  <div class="print p-orisa">
    <img src="agency-hero-proof-orisa.jpg" alt="">
        <div class="tape" style="left:118px; top:-12px; transform:rotate(3deg)"></div>
  </div>

  <div class="print p-norio">
    <img src="agency-hero-proof-norio.jpg" alt="">
        <div class="tape" style="left:96px; top:-13px; transform:rotate(-4deg)"></div>
  </div>

  <div class="print p-isak">
    <img src="agency-hero-proof-isak.jpg" alt="">
    <div class="cap">Isak · one-person portfolio</div>
  </div>
  <div class="crop" style="left:676px; top:323px; border-width:2px 0 0 2px"></div>
  <div class="crop" style="left:1013px; top:330px; border-width:2px 2px 0 0"></div>

  <svg class="pencil" width="1200" height="630" viewBox="0 0 1200 630" fill="none" stroke="#b3261e" stroke-linecap="round" stroke-linejoin="round">
    <!-- loose loop around the Orisa headline area, drawn twice like a real pencil -->
    <path d="M612 175 C 640 120, 790 108, 905 140 C 958 156, 950 214, 900 232 C 820 262, 655 258, 618 222 C 598 203, 602 186, 640 168" stroke-width="3.2" opacity=".9"/>
    <path d="M630 160 C 700 128, 860 126, 925 160" stroke-width="2" opacity=".55"/>
    <!-- arrow from note to isak print -->
    <path d="M1100 470 C 1080 520, 1040 545, 1000 540" stroke-width="3"/>
    <path d="M1012 528 L 998 541 L 1015 551" stroke-width="3"/>
    <!-- underline under the word loud -->
    <path d="M214 243 C 250 250, 300 249, 330 241" stroke-width="3.4" opacity=".85"/>
  </svg>
  <div class="note" style="left:952px; top:96px; font-size:30px; transform:rotate(6deg)">louder than<br>the work?</div>
  <div class="note" style="left:1046px; top:432px; font-size:30px; transform:rotate(-5deg)">calm.<br>✓ ships</div>

</div></body></html>
