<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden;
         font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }

  .stage { position:relative; width:1200px; height:630px;
           background:linear-gradient(135deg,#152a63 0%,#1b3a86 45%,#24499e 100%);
           overflow:hidden; }

  .blob { position:absolute; border-radius:50%; filter:blur(2px); }
  .b1 { width:420px; height:420px; right:-90px; top:-140px; background:rgba(90,130,235,.20); }
  .b2 { width:300px; height:300px; left:-120px; bottom:-130px; background:rgba(90,130,235,.16); }
  .b3 { width:170px; height:170px; right:300px; bottom:-70px; background:rgba(120,160,255,.10); }

  .grid { position:absolute; inset:0; opacity:.055;
          background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),
                           linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);
          background-size:56px 56px; }

  .content { position:relative; padding:60px 70px; height:100%; }

  .brand { display:flex; align-items:center; gap:14px; margin-bottom:40px; }
  .brand img { width:40px; height:40px; border-radius:9px; display:block; }
  .brand span { color:#fff; font-size:26px; font-weight:700; letter-spacing:-.01em; }

  h1 { font-size:72px; line-height:1.03; font-weight:900; letter-spacing:-.035em; color:#fff; }
  h1 .y { color:#ffc93c; }

  .sub { margin-top:20px; font-size:23px; line-height:1.45; color:#c3d0ee; font-weight:400; max-width:620px; }

  .code { margin-top:30px; display:flex; flex-wrap:wrap; gap:9px; max-width:640px; }
  .chip { display:inline-flex; align-items:center; gap:10px; width:max-content;
          background:rgba(6,14,38,.55); border:1px solid rgba(255,255,255,.14);
          padding:10px 18px; border-radius:11px; }
  .chip .q { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:16.5px;
             font-weight:500; color:#ffd977; letter-spacing:-.01em; }
  .chip .p { font-size:14px; font-weight:700; color:#8fa6d8; letter-spacing:.02em; }

  .badge { position:absolute; right:84px; top:196px; width:248px; height:248px; border-radius:50%;
           background:radial-gradient(circle at 34% 28%,#ffe07a 0%,#ffc93c 46%,#f0ac10 100%);
           box-shadow:0 26px 60px rgba(0,0,0,.34), inset 0 -7px 22px rgba(180,120,0,.28);
           display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .badge .n { font-size:104px; line-height:.92; font-weight:900; color:#2a1c00; letter-spacing:-.05em; }
  .badge .t1 { margin-top:2px; font-size:25px; font-weight:900; color:#2a1c00; letter-spacing:-.01em; line-height:1; }
  .badge .t2 { margin-top:8px; font-size:12.5px; font-weight:800; color:#4a3200; letter-spacing:.16em; }
</style></head>
<body>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grid"></div>

  <div class="content">
    <div class="brand">
      <img src="https://botble.com/storage/general/logo.png" alt="">
      <span>Botble</span>
    </div>

    <h1>Which <span class="y">Laravel CMS</span><br>should you use?</h1>

    <div class="sub">Nine options compared for 2026 &mdash; real pricing,<br>honest trade-offs, one decision table.</div>

    <div class="code">
      <div class="chip"><span class="q">Botble</span><span class="p">$29 once</span></div>
      <div class="chip"><span class="q">Statamic</span><span class="p">$349/yr</span></div>
      <div class="chip"><span class="q">October</span><span class="p">$39/yr</span></div>
      <div class="chip"><span class="q">Winter &middot; Twill</span><span class="p">free</span></div>
    </div>
  </div>

  <div class="badge">
    <div class="n">9</div>
    <div class="t1">options</div>
    <div class="t2">RANKED 2026</div>
  </div>
</div>
</body></html>
